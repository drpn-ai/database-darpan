/*
 * Darpan database reconciliation source component.
 *
 * Mirrors the sibling integration components (netsuite-darpan, shopify-darpan): the Groovy under
 * src/main/groovy is compiled and jarred into lib/ so Moqui's component class loader can pick it up
 * (Moqui only adds <component>/classes and <component>/lib/*.jar to the runtime classpath — it does
 * not compile src/ on its own). Later tasks add the JDBC extraction support classes here.
 */

apply plugin: 'groovy'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

def componentNode = parseComponent(project)
version = componentNode.'@version'
def jarBaseName = componentNode.'@name'
def moquiDir = projectDir.parentFile.parentFile.parentFile
def frameworkDir = file(moquiDir.absolutePath + '/framework')

repositories {
    flatDir name: 'localLib', dirs: frameworkDir.absolutePath + '/lib'
    mavenCentral()
    // jitpack only serves the transitive com.github.saasquatch:json-schema-inferrer inherited via :darpan;
    // scoped so it cannot shadow anything else (dependency confusion).
    maven {
        url = 'https://jitpack.io'
        content { includeModule('com.github.saasquatch', 'json-schema-inferrer') }
    }
}

sourceSets {
    main {
        groovy { srcDirs = ['src/main/groovy'] }
    }
    test {
        groovy { srcDirs = ['src/test/groovy'] }
    }
}

tasks.withType(JavaCompile) { options.compilerArgs << "-proc:none" }
tasks.withType(GroovyCompile) { options.compilerArgs << "-proc:none" }

dependencies {
    implementation project(':framework')
    implementation project(':runtime:component:darpan')
    compileOnly 'com.mysql:mysql-connector-j:8.3.0'   // runtime copy provided by darpan/lib/mysql-connector-j-8.3.0.jar
    implementation 'org.postgresql:postgresql:42.7.4' // BSD-2; copied into lib/ by copyDependencies
    implementation 'com.ibm.db2:jcc:11.5.9.0'         // IBM IPLA via Maven Central; copied into lib/; flag for license inventory

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation project(':runtime:component:darpan').sourceSets.test.output
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2' // Gradle 8/9 no longer auto-provides the launcher
    testRuntimeOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0' // Moqui 4 boots a jakarta servlet context; framework supplies it as provided
}

// by default the Java plugin runs test on build; change to not do that (only run tests on demand).
// Mirrors the :darpan sibling so component builds stay fast and tests are an explicit task.
check.dependsOn.clear()

test {
    useJUnitPlatform()
    // Moqui keeps process-global state; isolate test classes so fixture state does not leak.
    maxParallelForks = 1
    forkEvery = 1
    jvmArgs(['-XX:+EnableDynamicAgentLoading', '--enable-native-access=ALL-UNNAMED'])
}

task cleanLib(type: Delete) { delete fileTree(dir: projectDir.absolutePath + '/lib', include: '*') }
clean.dependsOn cleanLib

jar {
    destinationDirectory = file(projectDir.absolutePath + '/lib')
    archiveBaseName = jarBaseName
}

task copyDependencies { doLast {
    copy { from (configurations.runtimeClasspath
            - project(':framework').configurations.runtimeClasspath
            - project(':framework').tasks.named('jar').get().archiveFile.get().asFile
            - project(':runtime:component:darpan').configurations.runtimeClasspath
            - project(':runtime:component:darpan').tasks.named('jar').get().archiveFile.get().asFile)
        into file(projectDir.absolutePath + '/lib') }
} }
copyDependencies.dependsOn cleanLib
jar.dependsOn copyDependencies
